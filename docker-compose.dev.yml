# 개발용
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domeok-back
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: ["uv", "run", "fastapi", "dev", "src/main.py", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - domeok-network
    env_file:
      - .env
    environment:
      - DB_HOST=domeok-db
      - REDIS_URL=redis://domeok-redis:6379/0
      - TZ=Asia/Seoul

  postgresql:
    image: pgvector/pgvector:pg15
    container_name: domeok-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=domeok
      - TZ=Asia/Seoul
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - domeok-network
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d domeok" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: domeok-redis
    ports:
      - "6379:6379"
    networks:
      - domeok-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  domeok-network:

volumes:
  postgres_dev_data: